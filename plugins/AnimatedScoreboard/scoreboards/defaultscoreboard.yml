#This is where you create the scoreboard, the first section will always be the title. 
#Every section after that will be a line displayed on the scoreboard. You can have a max
#of 15 lines display due to the limitations of minecraft.
display:
    #This is the first section, it will always be the title of the scoreboard. 
    #You can also use placeholders here if you want.
    title:
      #This is the text that will be display as the title, it can have as many lines as you want and it will automatically rotate through them or
      #choose a random one, depending on what you set random to.
      text:
      - "&6&l⚓  &#FC8600&lSKY&#CC720A&lBL☠CK  &6&l⚓"
      #If this is true there will be a random line every time it updates. 
      #If it is false than it will rotate through them and you can make some animations with it.
      random: false
      #The time between updates, 20 ticks is 1 second.
      #Every x ticks it will go to the next line, if random is false, once all lines are displayed it will go to the first line.
      interval: 2
    #This section is the first line, here you set the data of that line. It doesn't matter what the name of the section is, as long
    # as there is no other section with the exact same name 
    line-1:
      text:
      - "      &#ABBFBF%localtime_time%"
      random: false
      interval: 200
      score: 99
    line-3:
      text:
      - " "
      random: false
      interval: 200
      score: 98
    line-include:
      text:
      - "&#ABBFBF▪ Profile ◂" 
      random: false
      interval: 200
      score: 97   
    line-4:
      text:
      - "⠐ &fRank: %vault_rankprefix_#% %vault_suffix%" 
      random: false
      interval: 100
      score: 96
    line-4-1:
      text:
      - "⠗ &fHP: &#FF8948%aureliumskills_hp%&7/&#E12B07%aureliumskills_hp_max% ♥"
      - "⠗ &fMana: &#E574C4%aureliumskills_mana%&7/&#AF418F%aureliumskills_mana_max% ❖"
      - "⠗ &fPower: &#387F53%aureliumskills_power% ☀"
      random: false
      interval: 100
      score: 95 
    line-4-2:
      text:
      - "⠔ &fKills: &#FE4A4A%statistic_player_kills% ⚔"
      - "⠔ &fDeaths: &7%statistic_deaths% ☠"
      random: false
      interval: 100
      score: 94
    line-5:
      text:
      - "⠎ &fMoney: &#F9E454%vault_eco_balance_formatted% ⛁"
      random: false
      interval: 100
      score: 93  
    line-6:
      text:
      - "⠏ &fPing: &#1ACCCC%player_ping%ms ⌛"
      random: false
      interval: 200
      score: 92 
    line-7:
      text:
      - " "     
      random: false
      interval: 200
      score: 91
    line-include2:
      text:
      - "&#ABBFBF▪ Information ◂" 
      random: false
      interval: 200
      score: 90
    line-9:
      text:
      - "⠄ &fBiome: &#ACF268%world_biome% ⚗" 
      random: false
      interval: 100
      score: 89
    line-10-2:
      text:
      - "⠘ &fOnline: &#2DF43F%server_online%&8/&#28B635%server_max_players% ☻"       
      random: false
      interval: 200
      score: 88
    line-10:
      text:
      - "⠈ &fPlayed: &#B36BF6%statistic_time_played% ⌚"
      - "⠈ &fMined: &#B36BF6%statistic_mine_block% ⚒"
      - "⠈ &fCrafted: &#B36BF6%statistic_craft_item% ⚙" 
      random: false
      interval: 100
      score: 87
    line-15:
      text:
      - " "       
      random: false
      interval: 200
      score: 86
    line-16:
      text:
      - "     &9▸ mc.servername.com ◂ "       
      random: false
      interval: 200
      score: 85