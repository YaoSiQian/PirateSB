#This is the lore of every auctioned item in the menu:
#Use %amount% for item's amount
auction-item-lore:
  #The lore for items with no ⛁ on them
  #Use %display-name-seller% for display name of the seller
  #Use %starting-bid% for the 起拍价
  #Use %duration% for auction duration
  auction-item-no-bid:
    - '&8&m---------------------'
    - '&7卖家： %display-name-seller%'
    - '&7起价： &6%starting-bid% ⛁'
    - ''
    - '&7结束于： &e%duration%'
    - ''
    - '&e点击查看！'
  #The lore for items with ⛁ on them
  #Use %display-name-seller% for display name of the seller
  #Use %bids% for the amount of ⛁
  #Use %top-bid% for the top bid
  #Use %top-bid-player% for the top bid player
  #Use %duration% for auction duration
  auction-item-with-bids:
    - '&8&m---------------------'
    - '&7卖家： %display-name-seller%'
    - '&7出价： &a%bids% ⛁'
    - ''
    - '&7最高出价： &6%top-bid% ⛁'
    - '&7出价人： %top-bid-player%'
    - ''
    - '&7结束于： &e%duration%'
    - ''
    - '&e点击查看！'
  #Use %display-name-seller% for display name of the seller
  #Use %bids% for the amount of ⛁
  #Use %top-bid% for the top bid
  #Use %top-bid-player% for the top bid player
  auction-item-ended:
    - '&8&m---------------------'
    - '&7卖家： %display-name-seller%'
    - '&7出价: &a%bids% ⛁'
    - ''
    - '&7最高出价： &6%top-bid% ⛁'
    - '&7出价人： %top-bid-player%'
    - ''
    - '&7状态： &a已结束！'
    - ''
    - '&e点击查看！'
  #Use %display-name-seller% for display name of the seller
  #Use %starting-bid% for the 起拍价
  auction-item-expired:
    - '&8&m---------------------'
    - '&7卖家： %display-name-seller%'
    - '&7起拍价: &6%starting-bid% ⛁'
    - ''
    - '&7状态： &c流拍！'
    - ''
    - '&e点击查看！'

