    - '&7可以点击这里看到它们!'
    - ''
    - '&c你没有任何出价!'

no-bids-message: '&c你没有任何出价!'

delivery-menu-name: '&8货物订单'
use-delivery-system: false

#This is the item for deliveries in the main menu
delivery-menu-item-name: '&a货物'
delivery-menu-item: '54'
delivery-menu-item-lore:
  - '&7来领取来自管理的礼物吧~'

delivery-have-message: '&a你有货物!'

