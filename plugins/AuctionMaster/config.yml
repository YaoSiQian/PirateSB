delivery-item:
  no-delivery-name: '&c没有货物'
  no-delivery-lore:
    - '&7空空如也 :('
  #Use %coins% for the amount of coins the player has in their delivery
  #Use %items-count% for the amount of items the player has in their delivery
  yes-delivery-name: '&a领取货物'
  yes-delivery-lore:
    - '&7你有货物!'
