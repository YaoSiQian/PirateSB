next-page-item-name: '&a下一页'
next-page-item-lore:
  - '&7(%page-number%/?)'
  - ''
  - '&e点击切换页码'

starting-menu-name: '交易行 菜单'
close-menu-item: '166'
close-menu-item-name: '&c关闭'
close-menu-item-lore: []

browsing-menu-name: '竞拍物品浏览'
browsing-menu-item: '41'
browsing-menu-item-name: '&6竞拍物品浏览'
browsing-menu-item-lore:
  - '&7找到玩家们在空岛生存中销售的物品'
  - ''
  - '&7这里提供的物品为&6拍卖&7物品'
  - '&7这意味着你必须持有最高出价来获取它们!'
  - ''
  - '&e点击浏览!'

view-bids-menu-name: '查看竞标'
view-bids-menu-item: '396'
#Use %total-bids% for the number of auctions the player has bid on
