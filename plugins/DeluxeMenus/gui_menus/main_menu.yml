#  A DeluxeMenus advanced configuration guide
#=========================================================
menu_title: '&#8B673A⚓ &lMain Menu &#8B673A⚓'
open_command:
  - menu
  - mainmenu
register_command: false
open_commands:
  - '[message] &#8B673A&l⚓&#8B673A You have just opened the main menu.'
  - '[sound] BLOCK_BEACON_ACTIVATE'
size: 27
open_requirement:
  requirements:
    permission:
      #
      # "has permission" checks if a player has the required permission
      #
      # Read more:
      #   https://wiki.helpch.at/clips-plugins/deluxemenus/options-and-configurations/requirements#has-permission
      #
      type: has permission
      permission: firts.open.menu
      deny_commands:
        - '[sound] UI_TOAST_CHALLENGE_COMPLETE'
        - '[console] lp user %player_name% permission set firts.open.menu'
        - '[player] menufirtopennow'
        
